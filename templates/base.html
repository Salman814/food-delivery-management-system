{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Food Delivery System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <div>
            <a href="{% url 'home' %}" style="font-weight:bold; font-size:20px;">🍔 Food Delivery</a>
        </div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'restaurant_list' %}">Restaurants</a>
            <a href="{% url 'cart' %}">Cart</a>
            <a href="{% url 'feedback' %}">Feedback</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <div class="footer">
        <p>&copy; 2026 Food Delivery Management System</p>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
